# Local re-run of grid jobs 2 and 11 from cluster 85634666 (died with no output
# or logs — infrastructure eviction). Slice lists = round-robin lines
# (NR-1)%40==i of data_onbeam.list. Outputs renamed into dfs/data_onbeam/ after.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs

jobs:
  - name: onbeam_slice2
    enabled: true
    description: recover grid job 2 slice locally
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, evt_pand, trk]
    input_list: data_onbeam_slice2.list
    output: data_onbeam_slice2
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 0
      ncpu: -1
      nfile: -1

  - name: onbeam_slice11
    enabled: true
    description: recover grid job 11 slice locally
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, evt_pand, trk]
    input_list: data_onbeam_slice11.list
    output: data_onbeam_slice11
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 0
      ncpu: -1
      nfile: -1
