# GEN2 off-beam data: InTime-Run1 (SBND2026A, v10_14_02_02), 49,020 files,
# full Run 1 offbeam — successor of Gen1's 35,176-file Spring25 sample.
# Copy of data_offbeam_grid.yaml; only name/input_list/output/args differ.
# PILOT NOW: ngrid 0, nfile 5. Campaign: nfile -1, ngrid 420 (~117 files/job).

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: gen2offbeam
    enabled: true
    description: gen2 off-beam data full-chain (cosmic component), no mcnu, no recomb update
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, evt_pand, trk]
    input_list: gen2_data_offbeam.list
    output: gen2_offbeam
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 420    # ~117 files/job (pilot 2026-08-09 PASSED on non-empty files; head-of-list empties skip gracefully)
      ncpu: 7       # ignored on grid
      nfile: -1
      memory: 4
