# gen2-barycenter: Gen2 BNB CV re-production carrying the FULL barycenterFM
# record (29 branches incl. flashAsymmetry, centers, widths, deltas — commit
# 7b1c280). Same frozen 749,262-file list and settings as gen2b_cv (raw
# flashPEs + flashpe_scale column), so cut flags and SumPOT must reproduce
# 5.40176e20 exactly — closure gate at harvest time.
# Pilot 2026-08-12 PASSED (21 filled barycenterFM cols; flashAsymmetry etc.
# all-NaN in this CAF era). Campaign: nfile -1, ngrid 7500 (~100 files/job).

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: gen2barycenter
    enabled: true
    description: Gen2 BNB CV with full barycenterFM record (flashAsymmetry, centers, widths, deltas)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - makedf.makedf.make_mcnudf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, mcnu, evt_pand, trk]
    input_list: gen2_mcbnb_cv.list
    output: gen2-barycenter
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: true
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 7500  # ~100 files/job
      ncpu: 7      # ignored on grid (hardcoded -ncpu 7)
      nfile: -1
      memory: 4
