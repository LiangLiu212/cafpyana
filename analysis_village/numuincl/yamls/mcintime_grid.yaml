# Intime-cosmic MC (prodcorsika intime, 206,903 files, 4.89e5 s livetime).
# Used ONLY for the cosmic-normalization unisim (nominal cosmics = off-beam data).
# dfs/settings follow Brinden's mcoffbeam.yaml: no mcnu, UPDATE_RECOMB=true.
# SCALE DECISION GATED on Phase-1 calibration (full def iff <= ~2,000 CPU h).

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: mcintime
    enabled: true
    description: intime-cosmic MC full-chain (cosmic-norm unisim alternate)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, evt_pand, trk]
    input_list: mc_intime65k.list   # Phase-1 gate: full def = ~6,300 CPU h > 2,000 cap -> 65k subset
    output: mcintime
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: true
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 650    # 100 files/job, ~26 min at the calibrated ~110 s/file
      ncpu: 7       # ignored on grid
      nfile: -1
      memory: 4
