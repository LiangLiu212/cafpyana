# FULL-definition BNB+Cosmics CV production: 374,055 files (~5.6e20 POT).
# Supersedes dfs/sel3000_grid/ for analysis use (the 3,000 files are a subset
# of this definition — never ADD the two samples, that double-counts).
# Sizing: 100 files/job at the calibrated ~100 s/file -> ~24 min core + overhead.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: mcbnbfull
    enabled: true
    description: full-definition BNB CV full-chain production (374k files)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - makedf.makedf.make_mcnudf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, mcnu, evt_pand, trk]
    input_list: mcbnb_cv_full.list
    output: mcbnb_full
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: true
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 3750
      ncpu: 7
      nfile: -1
      memory: 4
