# One-off pilot for the GEN2 offbeam stream on 5 VERIFIED NON-EMPTY files
# (the head of gen2_data_offbeam.list is a cluster of 0-event CAFs — known
# offbeam phenomenon, they skip gracefully; random 30-file probe: 0% empty).
# Campaign yaml: gen2_offbeam_grid.yaml (unchanged).

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs

jobs:
  - name: gen2offbeampilot
    enabled: true
    description: gen2 off-beam schema pilot on non-empty files
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, evt_pand, trk]
    input_list: gen2_offbeam_pilot5.list
    output: gen2_offbeam_pilot
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 0
      ncpu: 5
      nfile: 5
      memory: 4
