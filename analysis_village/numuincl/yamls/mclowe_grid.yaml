# Low-energy MC (lowenergydirt 1-100 MeV, ~123k files, 5.93e18 POT full def).
# dfs/settings follow Brinden's mclowe.yaml: with mcnu, UPDATE_RECOMB=true.
# ngrid: 0 until Phase-1 calibration; nfile: 5 for the local calibration run.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: mclowe
    enabled: true
    description: low-E MC full-chain (fills 1-100 MeV nu phase space in the prediction)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - makedf.makedf.make_mcnudf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, mcnu, evt_pand, trk]
    input_list: mclowe.list
    output: mclowe
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: true
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 1300   # ~95 files/job, ~23 min at the calibrated ~100 s/file
      ncpu: 7       # ignored on grid
      nfile: -1
      memory: 4
