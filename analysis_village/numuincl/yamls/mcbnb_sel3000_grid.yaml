# 3000-file full-chain GRID production, upgrading the 500-file local cut-flow
# sample (mcbnb_sel500.yaml) to the full vtx3000 statistics (4.50e18 POT).
# Same dfs/settings as sel500 so results are directly comparable.
#
# Sizing: 100 jobs x 30 files round-robin; ~100 s CPU/file with -ncpu 7 per job
# -> ~7 min core time/job + xrdcp/venv overhead, inside the 1h lifetime.
#
# Grid-mode naming (see mcbnb_test5_grid.yaml): output_dir is ignored; dfs land in
#   $CAFPYANA_GRID_OUT_DIR/dfs/<TS>__sel3000grid_mcbnb_cv_sel3000/
#       sel3000grid_mcbnb_cv_sel3000_<i>.df   (i = 0..99)
# Scratch is evictable -- copy the merged outputs to /exp/sbnd/data after completion.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: sel3000grid
    enabled: true
    description: 3000-file full-chain grid production (100 jobs x 30 files) for high-stat selection studies
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - makedf.makedf.make_mcnudf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, mcnu, evt_pand, trk]
    input_list: mcbnb_cv_vtx3000.list
    output: mcbnb_cv_sel3000
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: true
      VERBOSE: true
      ADD_STAT_UNC: false
    args:
      ngrid: 100
      ncpu: 7      # IGNORED on the grid: run_df_maker.py hardcodes "-ncpu 7" into run_<i>.sh
      nfile: -1
      memory: 4    # GB -> jobsub --memory 4GB (validated in test5grid)
