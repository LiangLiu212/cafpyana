# gen1-barycenter-mcintime: same frozen list and settings as its twin campaign; carries the
# full barycenterFM record (makedf/branches.py ab58d05; 21 filled fields
# in this CAF era). Closure gate at harvest: event counts/POT/gates must
# reproduce the twin.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: gen1barymcintime
    enabled: true
    description: Gen1 intime-cosmic MC 65k subset with full barycenterFM record (twin of mcintime)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, evt_pand, trk]
    input_list: mc_intime65k.list
    output: gen1-barycenter-mcintime
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: true
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 650
      ncpu: 7
      nfile: -1
      memory: 4
