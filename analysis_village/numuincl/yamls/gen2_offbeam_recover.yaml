# Recovery of 6 dead gen2-offbeam grid jobs (cluster 71354722 indices
# 52,53,56,84,103,418): their exact round-robin input lines ((NR-1)%420==k)
# from the FROZEN gen2_data_offbeam.list, run locally as one job.
# Output gen2_offbeam_recover.df is moved into dfs/gen2_offbeam/ afterwards.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs

jobs:
  - name: gen2offbeamrec
    enabled: true
    description: local recovery of 6 straggler offbeam grid jobs
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, evt_pand, trk]
    input_list: gen2_offbeam_recover.list
    output: gen2_offbeam_recover
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 0
      ncpu: -1
      nfile: -1
      memory: 4
