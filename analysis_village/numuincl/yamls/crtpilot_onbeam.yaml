# CRT pilot: on-beam data (first 200 files of data_onbeam.list) — in-beam
# cross-checks for the cosmic center calibration (small; scale later if used).
# Parent settings from data_onbeam_grid.yaml (UPDATE_RECOMB=false).
# Local pool on the EAF pod; ~160 s/file -> ~70 min at ncpu 8.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs

jobs:
  - name: crtpilot_onbeam
    enabled: true
    description: on-beam data CRT pilot (in-beam cross-checks)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
      - makedf.makedf.make_sbndcrttrackdf
      - makedf.makedf.make_sbndcrttrackptsdf
      - makedf.makedf.make_opflashdf
      - makedf.makedf.make_crtspdf
    names: [hdr, evt_pand, trk, crttrk, crttrkpts, opflash, crtsp]
    input_list: crtpilot_onbeam.list
    output: crtpilot_onbeam
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 0
      ncpu: 8
      nfile: -1
      memory: 4
