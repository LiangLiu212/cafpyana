# GEN2 on-beam data: FixedDev_Respin + RollingDev_Respin (SBND2026A, v10_14_02_04),
# 3,328 files, same DocDB 44638 run lists as Gen1 dev (a v10_14 respin).
# SAM registers these files enstore-only (paths are /pnfs/sbn/data_add persistent
# namespace) — verify online-ness at pilot; prestage the two defs if NEARLINE.
# Copy of data_onbeam_grid.yaml; only name/input_list/output/args differ.
# PILOT NOW: ngrid 0, nfile 5. Campaign: nfile -1, ngrid 60 (~55 files/job).

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: gen2onbeam
    enabled: true
    description: gen2 on-beam data full-chain (FixedDev+RollingDev Respin), no mcnu, no recomb update
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, evt_pand, trk]
    input_list: gen2_data_onbeam.list
    output: gen2_onbeam
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 60     # ~55 files/job (pilot 2026-08-09 PASSED: keys+NEED+cutflow ok, ~100 s/file)
      ncpu: 7       # ignored on grid (hardcoded -ncpu 7)
      nfile: -1
      memory: 4
