# CRT pilot: off-beam data (first 1,000 files of data_offbeam.list).
# Parent settings from data_offbeam_grid.yaml (UPDATE_RECOMB=false) plus the
# CRT-track / opflash / spacepoint makers for the cosmic center calibration.
# Local pool on the EAF pod (32-core cgroup quota); ~34 s/file -> ~70 min at ncpu 8.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs

jobs:
  - name: crtpilot_offbeam
    enabled: true
    description: off-beam data CRT pilot (golden-cosmic center calibration)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
      - makedf.makedf.make_sbndcrttrackdf
      - makedf.makedf.make_sbndcrttrackptsdf
      - makedf.makedf.make_opflashdf
      - makedf.makedf.make_crtspdf
    names: [hdr, evt_pand, trk, crttrk, crttrkpts, opflash, crtsp]
    input_list: crtpilot_offbeam.list
    output: crtpilot_offbeam
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 0
      ncpu: 8
      nfile: -1
      memory: 4
