# GEN2 CV MC: aurora_SBND2026A_gen2_BNBLight_prodgenie_corsika_proton_rockbox0p1_sbnd_CV
# v10_14_02_03 flatcaf — the "full Run 1 x5" sample. The SAM def is DYNAMIC (still
# growing; ~749k files on 2026-08-09): gen2_mcbnb_cv.list is the frozen snapshot.
# NEVER add this sample to the DevSample (250k snapshot — presumed subset).
# NOTE: the Gen2 wiki DevSample is a different def; this yaml is the x5 campaign.
# Copy of mcbnb_full_grid.yaml; only name/input_list/output/args differ.
# PILOT NOW: ngrid 0, nfile 5. Campaign: nfile -1, ngrid 7500 (~100 files/job;
# fallback if -N 7500 rejected: split list round-robin into two clusters).

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: gen2mcbnb
    enabled: true
    description: gen2 BNB CV x5 full-chain production (frozen 749k-file snapshot list)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - makedf.makedf.make_mcnudf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, mcnu, evt_pand, trk]
    input_list: gen2_mcbnb_cv.list
    output: gen2_cv
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: true
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 7500   # ~100 files/job (pilot 2026-08-09 PASSED; 7.26e14 POT/file matches mc.pot metadata)
      ncpu: 7       # ignored on grid (hardcoded -ncpu 7)
      nfile: -1
      memory: 4
