# FULL in-time cosmic MC with CRT for the cosmic center calibration
# (mc_intime65k.list: 65,000 files, 2,149,505 events — the campaign subset).
# Same chain as crtfull_offbeam: gate-windowed CRT makers, opflash, no crtsp.
# Grid: 650 jobs x 100 files (~26 min/job at the calibrated ~110 s/file wall,
# far less at EAF-measured CPU); UPDATE_RECOMB=true per the parent sample.

input_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/lists
output_dir: /exp/sbnd/data/users/liangliu/cc-inclusive/dfs   # ignored in grid mode

jobs:
  - name: crtfull_mcintime
    enabled: true
    description: full intime cosmic MC CRT production (golden-cosmic calibration)
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
      - makedf.makedf.make_sbndcrttrackdf_gatewin
      - makedf.makedf.make_sbndcrttrackptsdf_gatewin
      - makedf.makedf.make_opflashdf
    names: [hdr, evt_pand, trk, crttrk, crttrkpts, opflash]
    input_list: mc_intime65k.list
    output: crtfull_mcintime
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: true
      VERBOSE: false
      ADD_STAT_UNC: false
    args:
      ngrid: 650
      ncpu: 7       # ignored on grid (hardcoded -ncpu 7)
      nfile: -1
      memory: 4
